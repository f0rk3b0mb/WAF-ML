<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #F7F8FA;
        }
        .page-header {
            background-color: #007BFF; /* Change this to your desired color */
            color: white;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="/">
            <img src="path/to/logo.png" alt="Logo" style="height: 50px;"> <!-- Replace with your logo path -->
        </a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('dashboard') }}">Visualize</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="page-header d-flex justify-content-between align-items-center">
        <div class="ms-3">
        </div>
        <h1 class="text-center flex-grow-1 mb-0">{% block title %}Page Title{% endblock %}</h1>
    </div>

    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>

    {% include 'footer.html' %}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
