version: '3.8'

services:
  waf:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1234:1234"
      - "80:80"
      - "443:443"
    environment:
      - APP_ENV=production
#    depends_on:
#      - db



  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml



